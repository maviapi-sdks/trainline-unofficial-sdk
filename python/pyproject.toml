[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trainline-unofficial-sdk"
version = "0.1.0"
description = "Unofficial Trainline API client"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["trainline", "trainline-api", "unofficial", "sdk", "maviapi"]

[project.urls]
Homepage = "https://maviapi.com/apis/thetrainline"
Repository = "https://github.com/maviapi-sdks/trainline-unofficial-sdk"

[tool.setuptools]
packages = ["trainline_sdk"]
